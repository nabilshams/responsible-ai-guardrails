name: Deploy hosted agent

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment containing Azure OIDC variables
        required: true
        default: dev

permissions:
  id-token: write
  contents: read

env:
  AZURE_DEV_USER_AGENT: microsoft_foundry_skill

jobs:
  deploy:
    # Use self-hosted runner with VNet access for private endpoint connectivity
    runs-on: [self-hosted, vnet-connected]
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: Azure/setup-azd@v2
      - name: Authenticate azd with federated identity
        run: azd auth login --client-id "$AZURE_CLIENT_ID" --federated-credential-provider github
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      - name: Select environment
        run: azd env select "${{ inputs.environment }}" || azd env new "${{ inputs.environment }}" --no-prompt
      - name: Configure deployment
        run: |
          azd env set AZURE_SUBSCRIPTION_ID "${{ vars.AZURE_SUBSCRIPTION_ID }}"
          azd env set AZURE_LOCATION "${{ vars.AZURE_LOCATION }}"
      - name: Preview infrastructure changes
        run: azd provision --preview --no-prompt
      - name: Provision and deploy
        run: azd up --no-prompt
