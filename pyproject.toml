[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "responsible-ai-guardrails"
version = "0.1.0"
description = "Enterprise Responsible AI guardrails and hosted agents for Microsoft Foundry"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Enterprise Agent Hub" }]
dependencies = [
  "azure-ai-agentserver-invocations>=1.1.0b1",
  "azure-ai-documentintelligence>=1.0.2",
  "azure-ai-textanalytics>=5.3.0",
  "azure-identity>=1.20.0",
  "azure-storage-blob>=12.26.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "opentelemetry-instrumentation-fastapi>=0.50b0",
  "pillow>=11.1.0",
  "pypdf>=5.1.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
  "bandit[toml]>=1.8.0",
  "mypy>=1.14.0",
  "pip-audit>=2.8.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.9.0",
]

[project.scripts]
live-document-redaction = "scripts.live_document_executor:main"

[tool.setuptools.packages.find]
include = ["agents*", "scripts*", "shared*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --cov=agents --cov=shared --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]
markers = ["azure: requires configured Azure services"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
exclude = ["tests"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]
